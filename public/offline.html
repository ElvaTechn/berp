<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - BizControl 360</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 1rem;
    }
    
    .container {
      text-align: center;
      max-width: 500px;
      animation: fadeIn 0.5s ease-in;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.7;
        transform: scale(1.05);
      }
    }
    
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    
    p {
      font-size: 1.125rem;
      opacity: 0.95;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .btn {
      background: white;
      color: #667eea;
      padding: 1rem 2rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      border: none;
      cursor: pointer;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      background: #f8f9fa;
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      margin-top: 2rem;
      font-size: 0.875rem;
      backdrop-filter: blur(10px);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background: #ff4444;
      border-radius: 50%;
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 50%, 100% {
        opacity: 1;
      }
      25%, 75% {
        opacity: 0.3;
      }
    }

    .online .status-dot {
      background: #44ff44;
      animation: none;
    }

    .features {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .features h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    .feature-list {
      text-align: left;
      display: inline-block;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }

    .feature-item::before {
      content: "✓";
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Você está offline</h1>
    <p>
      Não foi possível conectar ao servidor. Verifique sua conexão com a internet
      e tente novamente.
    </p>
    
    <button class="btn" onclick="tryReload()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
      </svg>
      Tentar Novamente
    </button>

    <div class="status" id="status">
      <span class="status-dot"></span>
      <span>Sem conexão</span>
    </div>

    <div class="features">
      <h2>Disponível em Modo Offline:</h2>
      <div class="feature-list">
        <div class="feature-item">Visualizar dados cacheados</div>
        <div class="feature-item">Registrar vendas localmente</div>
        <div class="feature-item">Sincronizar quando voltar online</div>
      </div>
    </div>
  </div>

  <script>
    // Detectar quando voltar online
    function updateStatus() {
      const status = document.getElementById('status');
      const dot = status.querySelector('.status-dot');
      
      if (navigator.onLine) {
        status.classList.add('online');
        status.querySelector('span:last-child').textContent = 'Conectado';
        
        // Redirecionar automaticamente
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1000);
      } else {
        status.classList.remove('online');
        status.querySelector('span:last-child').textContent = 'Sem conexão';
      }
    }

    function tryReload() {
      if (navigator.onLine) {
        window.location.href = '/dashboard';
      } else {
        window.location.reload();
      }
    }

    // Event listeners
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);

    // Check initial status
    updateStatus();
  </script>
</body>
</html>
