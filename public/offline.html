<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Offline - BizControl 360</title>
  <style>
    /* ================================================
       NEUMORPHISM OFFLINE PAGE - BIZCONTROL 360
       Tema consistente com o resto da aplicação
       ================================================ */
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      /* Cores do sistema */
      --neu-base: #E8ECEF;
      --neu-surface: #E8ECEF;
      --neu-text-primary: #1A1D21;
      --neu-text-secondary: #4A5058;
      --neu-text-muted: #7A8088;
      --neu-accent: #EF4444;
      --neu-success: #10B981;
      --neu-shadow-light: #FFFFFF;
      --neu-shadow-dark: #C4C9D0;
    }
    
    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      :root {
        --neu-base: #000000;
        --neu-surface: #0A0A0A;
        --neu-text-primary: #F3F4F6;
        --neu-text-secondary: #D1D5DB;
        --neu-text-muted: #9CA3AF;
        --neu-accent: #F87171;
        --neu-success: #34D399;
        --neu-shadow-light: rgba(255, 255, 255, 0.05);
        --neu-shadow-dark: rgba(0, 0, 0, 0.5);
      }
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--neu-base);
      color: var(--neu-text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      
      /* iOS safe area */
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      padding-left: max(1.5rem, env(safe-area-inset-left));
      padding-right: max(1.5rem, env(safe-area-inset-right));
    }
    
    .container {
      text-align: center;
      max-width: 600px;
      animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Neumorphic Icon Container */
    .icon-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
      border-radius: 2rem;
      background: var(--neu-surface);
      box-shadow: 
        -8px -8px 16px var(--neu-shadow-light),
        8px 8px 16px var(--neu-shadow-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 
          -8px -8px 16px var(--neu-shadow-light),
          8px 8px 16px var(--neu-shadow-dark);
      }
      50% {
        transform: scale(1.02);
        box-shadow: 
          -10px -10px 20px var(--neu-shadow-light),
          10px 10px 20px var(--neu-shadow-dark);
      }
    }
    
    .icon {
      font-size: 3.5rem;
      filter: grayscale(0.3);
    }
    
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      margin-bottom: 1rem;
      line-height: 1.2;
      color: var(--neu-text-primary);
      letter-spacing: -0.02em;
    }
    
    p {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--neu-text-secondary);
      margin-bottom: 2.5rem;
      line-height: 1.6;
      max-width: 90%;
      margin-left: auto;
      margin-right: auto;
    }
    
    /* Neumorphic Button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2rem;
      border-radius: 1rem;
      background: var(--neu-surface);
      color: var(--neu-accent);
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        -4px -4px 8px var(--neu-shadow-light),
        4px 4px 8px var(--neu-shadow-dark);
    }
    
    .btn:hover {
      box-shadow: 
        -6px -6px 12px var(--neu-shadow-light),
        6px 6px 12px var(--neu-shadow-dark);
      transform: translateY(-2px);
    }
    
    .btn:active {
      box-shadow: 
        inset -2px -2px 4px var(--neu-shadow-light),
        inset 2px 2px 4px var(--neu-shadow-dark);
      transform: translateY(0);
    }
    
    .btn svg {
      width: 20px;
      height: 20px;
    }
    
    /* Status Badge */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      margin-top: 2rem;
      border-radius: 3rem;
      background: var(--neu-surface);
      box-shadow: 
        inset -2px -2px 4px var(--neu-shadow-light),
        inset 2px 2px 4px var(--neu-shadow-dark);
      font-size: 0.875rem;
      color: var(--neu-text-muted);
      font-weight: 500;
    }
    
    .status-dot {
      width: 10px;
      height: 10px;
      background: var(--neu-accent);
      border-radius: 50%;
      animation: blink 1.5s ease-in-out infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    
    .status.online .status-dot {
      background: var(--neu-success);
      animation: none;
    }
    
    /* Features List */
    .features {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--neu-text-muted);
      opacity: 0.7;
    }
    
    .features h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--neu-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      text-align: left;
      max-width: 400px;
      margin: 0 auto;
    }
    
    .feature-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      color: var(--neu-text-secondary);
      padding: 0.5rem;
      border-radius: 0.5rem;
      background: var(--neu-surface);
      box-shadow: 
        -2px -2px 4px var(--neu-shadow-light),
        2px 2px 4px var(--neu-shadow-dark);
    }
    
    .feature-item::before {
      content: "✓";
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: var(--neu-success);
      color: white;
      border-radius: 50%;
      flex-shrink: 0;
      font-weight: bold;
      font-size: 0.875rem;
    }
    
    /* Responsive */
    @media (max-width: 640px) {
      .icon-container {
        width: 100px;
        height: 100px;
      }
      
      .icon {
        font-size: 3rem;
      }
      
      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Neumorphic Icon -->
    <div class="icon-container">
      <div class="icon">📡</div>
    </div>
    
    <!-- Heading -->
    <h1>Você está offline</h1>
    <p>
      Não foi possível conectar ao servidor. Verifique sua conexão com a internet
      e tente novamente.
    </p>
    
    <!-- Retry Button -->
    <button class="btn" onclick="tryReload()">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
      </svg>
      <span>Tentar Novamente</span>
    </button>
    
    <!-- Status Badge -->
    <div class="status" id="status">
      <span class="status-dot"></span>
      <span>Sem conexão</span>
    </div>
    
    <!-- Offline Features -->
    <div class="features">
      <h2>Disponível offline:</h2>
      <div class="feature-list">
        <div class="feature-item">Visualizar dados em cache</div>
        <div class="feature-item">Registrar vendas localmente</div>
        <div class="feature-item">Sincronizar automaticamente</div>
      </div>
    </div>
  </div>
  
  <script>
    // Detectar quando voltar online
    function updateStatus() {
      const status = document.getElementById('status');
      const dot = status.querySelector('.status-dot');
      const text = status.querySelector('span:last-child');
      
      if (navigator.onLine) {
        status.classList.add('online');
        text.textContent = 'Conectado! Redirecionando...';
        
        // Redirecionar automaticamente
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1000);
      } else {
        status.classList.remove('online');
        text.textContent = 'Sem conexão';
      }
    }
    
    function tryReload() {
      if (navigator.onLine) {
        window.location.href = '/dashboard';
      } else {
        window.location.reload();
      }
    }
    
    // Event listeners
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    
    // Check initial status
    updateStatus();
    
    // Vibration feedback on button (if supported)
    document.querySelector('.btn').addEventListener('click', () => {
      if ('vibrate' in navigator) {
        navigator.vibrate(50);
      }
    });
  </script>
</body>
</html>
